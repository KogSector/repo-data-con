[project]
name = "repo-data-con"
version = "1.0.0"
description = "Repository connection and integration service for ConFuse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "structlog>=26.1.0",
    # gRPC removed: data-connector communicates with unified-processor via Kafka
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.31.0",
    "PyGithub>=2.9.1",
    "python-gitlab>=8.4.0",
    "cryptography>=49.0.0",
    "psycopg2-binary>=2.9.12",
    "tenacity>=9.1.4",
    "prometheus-client>=0.25.0",
    "APScheduler>=3.11.2",
    "aiocouch>=4.0.1",
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "confluent-kafka>=2.14.2",
    "redis>=8.0.0",
    "python-multipart>=0.0.32",
    "PyJWT>=2.13.0",
    "python-dateutil>=2.9.0.post0",
    "aiofiles>=25.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
